name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend:
    # Passes while there is no frontend; runs lint and build once frontend/package.json exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "20"
      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm install
      - name: Lint
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run lint
      - name: Build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build
