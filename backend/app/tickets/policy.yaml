# Ticket assistant policy: numbers the code decides with, kept out of the code so they can be tuned.
# Thresholds are placeholders until tuned on the val split (never on test).

similar:
  index_fields: [subject, description, affected_service]   # what a past ticket is searched by
  k: 5                      # how many similar tickets to return
  rrf_k: 60                 # reciprocal rank fusion constant: 1 / (rrf_k + rank)
  service_bonus: 0.008      # added to the fused score (RRF units) when affected_service matches
  dup_threshold: 0.85       # score >= this -> likely_duplicate
  related_threshold: 0.70   # score >= this -> related, else weak

# The code gate (app/tickets/gate.py): decides RECOMMEND / CLARIFY / ESCALATE / BLOCKED before any LLM runs.
# All numbers are placeholders until tuned on the val split (never on test).
gate:
  min_words: 5              # subject + description shorter than this -> CLARIFY (too vague)
  ood_threshold: 0.55       # best similar score below this -> nothing like it before -> ESCALATE
  ambiguity_margin: 0.10    # top-2 category probabilities closer than this -> CLARIFY
  conflict_margin: 0.05     # top-2 strong matches this close with different root causes -> ESCALATE
  min_class_prob: 0.60      # classifier must be at least this sure to RECOMMEND
  safety_group: "Desktop Support L2 (safety)"
  default_group: "Service Desk L2"
  escalation_groups:
    Hardware: "Desktop Support"
    Software: "Application Support"
    Network: "Network Operations"
    Access: "Identity & Access"
    Email: "Messaging"
  vague_question: "Please describe what you were doing, the exact error message, and which application or device is affected."
  clarify_questions:        # key: the two categories in alphabetical order, joined by "|"
    "Access|Network": "Are you trying to sign in to your account or laptop, or to connect to the VPN or network?"
